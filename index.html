<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Script</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Fishing Script</h1>
        <div id="location">
            <p>Click the button below to get your location.</p>
            <button id="getLocationBtn">Get Location</button>
            <p id="locationOutput"></p>
        </div>
        <div id="camera">
            <p>Click the button below to capture an image from your camera.</p>
            <button id="captureImageBtn">Capture Image</button>
            <canvas id="canvas"></canvas>
            <img id="capturedImage" alt="Captured Image">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
